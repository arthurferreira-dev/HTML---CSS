<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais sobre Flex-Direction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tipos de <code>flex-direction</code></h1>
    <h2><code>flex-direction: row;</code></h2>
    <div class="container" id="a">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <br>

    <h2><code>flex-direction: row-reverse</code></h2>
    <div class="container" id="b">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <br>

    <h2><code>flex-direction: column</code></h2>
    <div class="container" id="c">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <br>

    <h2><code>flex-direction: column-reverse</code></h2>
    <div class="container" id="d">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
</body>
</html>
