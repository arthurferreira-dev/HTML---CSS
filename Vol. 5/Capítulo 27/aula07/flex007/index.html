<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia dos itens Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Usando o <code>order</code> para mudar a ordem das <code>div</code></h1>
    <br>
    <h2 class="inline-title">
        A <code>div</code> <div class="itens">-1</div>
        usa o <code>order</code> como <code>order: 1;</code> <br> <br>
        pois o ponto inical do <code>order</code> é <code>order: 0;</code>
    </h2>
    <div class="container">
        <div class="item" id="i1">-1</div>
        <div class="item" id="i2">5</div>
        <div class="item" id="i3">-5</div>
        <div class="item" id="i4">0</div>
        <div class="item" id="i5">45</div>
        <div class="item" id="i6">-45</div>
        <div class="item" id="i7">1</div>
    </div>
    <br>
    <h2>
        Exercício feito pelo 
        <code>
            <a href="https://github.com/gustavoguanabara">
                gustavoguanabara
            </a>
        </code>
    </h2>
    <div class="container">
        <div class="item" id="a">A</div>
        <div class="item" id="f">F</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
        <div class="item" id="d">D</div>
        <div class="item" id="e">E</div>
        <div class="item" id="g">G</div>
    </div>
</body>
</html>
