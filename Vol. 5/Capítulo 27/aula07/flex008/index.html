<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia dos itens Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Usando <code>align-self</code></h1> <br>
    <h2 class="inline-title">
        a <code>div</code> <div class="itens">X</div> está com 
        <code>
            align-self: auto;
        </code>
    </h2>
    <br>

    <h2 class="inline-title">
        a <code>div</code> <div class="itens">G</div> está como
        <code>align-self: flex-start;</code>
    </h2>
    <br>

    <h2 class="inline-title">
        a <code>div</code> <div class="itens">V</div> está como
        <code>align-self: flex-end;</code>
    </h2>
    <br>

    <h2 class="inline-title">
        a <code>div</code> <div class="itens">Y</div> está como
        <code>align-self: center;</code>
    </h2>
    <br>

    <h2 class="inline-title">
        a <code>div</code> <div class="itens">K</div> está como
        <code>align-self: stretch;</code>
    </h2>
    <br>

    <div class="container" style="height: 300px;">
        <div class="item" id="selfx">X</div>
        <div class="item" id="selfg">G</div>
        <div class="item" id="selfv">V</div>
        <div class="item" id="selfy">Y</div>
        <div class="item" id="selfk">K</div>
    </div>
    <br>
    <h2>
        Lembrando que o <code>.container</code>
        está com o <code>height: 300px;</code>.
    </h2> 
</body>
</html>
